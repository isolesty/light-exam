<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="light-exam-oidc-origin" content="__OIDC_ORIGIN__"><meta name="theme-color" content="#5750bf"><title>登录 · 轻量考试</title><link rel="stylesheet" href="/styles.css"></head>
<body class="login-body"><main class="login-shell"><div class="brand login-brand"><span class="brand-mark"><svg class="icon icon-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 5.5c3-1 5-1 8 1 3-2 5-2 8-1v14c-3-1-5-1-8 1-3-2-5-2-8-1Z"/><path d="M12 6.5v14M7 9h2m6 0h2M7 12h2m6 0h2"/></svg></span><div><strong>轻量考试</strong><small>题库 · 练习 · 考试</small></div></div><section class="panel login-panel"><span class="eyebrow">欢迎回来</span><h1>登录后开始答题</h1><p id="loginHelp">请使用管理员分配的用户名和密码登录。</p><form id="loginForm"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" required maxlength="32"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required><p id="loginError" class="login-error" role="alert" hidden></p><button id="loginButton" class="primary-button wide" type="submit">登录</button></form><div id="oidcLoginGroup" class="hidden"><div class="login-divider">或</div><a class="secondary-button login-oidc" href="/auth/login"><svg class="icon icon-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 3 8 3v6c0 5-4 8-8 10-4-2-8-5-8-10V6Z"/><path d="m8 12 3 3 5-6"/></svg><span class="button-label">使用懒猫账号登录</span></a></div></section><p id="oidcLoginNote" class="login-note hidden">首次使用时请通过懒猫管理员身份登录，并按需设置本地管理员密码。</p></main><script src="/login.js" defer></script></body></html>
