<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173e41"><title>登录 · 轻量考试</title><link rel="stylesheet" href="/styles.css"></head>
<body class="login-body"><main class="login-shell"><div class="brand login-brand"><span class="brand-mark">考</span><div><strong>轻量考试</strong><small>题库 · 练习 · 考试</small></div></div><section class="panel login-panel"><span class="eyebrow">欢迎回来</span><h1>登录后开始答题</h1><p>可使用懒猫微服账号免密登录，也可使用管理员分配的本地账号。</p><form id="loginForm"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" required maxlength="32"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required><p id="loginError" class="login-error" role="alert" hidden></p><button id="loginButton" class="primary-button wide" type="submit">登录</button></form><div class="login-divider">或</div><a class="secondary-button login-oidc" href="/auth/login">使用懒猫账号登录</a></section><p class="login-note">首次使用时请通过懒猫管理员身份登录，并按需设置本地管理员密码。</p></main><script src="/login.js" defer></script></body></html>
